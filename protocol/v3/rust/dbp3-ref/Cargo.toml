[package]
name = "dbp3-ref"
version = "0.10.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
crc32fast = "1.4"
sha3 = "0.10"
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dbp3-conformance"
path = "src/main.rs"
